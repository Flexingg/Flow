name: Build & Release APK

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flow Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            CLEAN_VER="${RAW_TAG#v}"
            VERSION_NAME="${CLEAN_VER}"
            VERSION_CODE=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            VERSION_CODE="${COMMIT_COUNT}"
            PATCH=$(( COMMIT_COUNT - 12 ))
            if [ "$PATCH" -lt 2 ]; then
              PATCH=2
            fi
            VERSION_NAME="0.0.${PATCH}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Determined Version: v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          APK_NAME="Flow-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}

      - name: Publish or Update GitHub Release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          CODE="${{ steps.version.outputs.version_code }}"
          APK_FILE="${{ steps.apk.outputs.apk_name }}"
          
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            gh release upload "${TAG_NAME}" "${APK_FILE}" --clobber
          else
            TAG_NAME="v${VERSION}"
            TITLE="Flow v${VERSION}"
            NOTES="Living Flow GTD v${VERSION} (build ${CODE}). Automatic build with seamless in-place updates."
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              echo "Release ${TAG_NAME} already exists. Uploading new APK asset..."
              gh release upload "${TAG_NAME}" "${APK_FILE}" --clobber
            else
              echo "Creating GitHub Release ${TAG_NAME}..."
              gh release create "${TAG_NAME}" "${APK_FILE}" --title "${TITLE}" --notes "${NOTES}" --latest
            fi
          fi
